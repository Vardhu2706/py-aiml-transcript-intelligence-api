version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/code
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: sh -c "./worker/run_worker.sh"
    volumes:
      - ./:/code
    depends_on:
      - api
      - redis
      - postgres
    env_file:
      - .env

  flower:
    image: mher/flower:0.9.7
    ports:
      - "5555:5555"
    environment:
      - FLOWER_PORT=5555
    command: flower --broker=${CELERY_BROKER_URL}
    depends_on:
      - redis

volumes:
  pgdata:
